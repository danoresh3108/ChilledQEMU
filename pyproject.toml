[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qemu-lle-workbench"
version = "0.8.0"
description = "Desktop QEMU project editor with explicit LLE dependency metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.scripts]
qemu-lle-workbench = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["qemu_lle_workbench*"]
